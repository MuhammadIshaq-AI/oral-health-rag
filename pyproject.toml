[project]
name = "dentalcare-au"
version = "0.1.0"
description = "Voice-enabled, citation-grounded oral health information assistant for Australia (research platform)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "DentalCare AU contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2",
    "textstat>=0.7.4",
    "jiwer>=3.0",
    "python-dotenv>=1.0",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
# Heavy model / infra dependencies. CI installs only the base + dev groups.
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.2",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
    "qdrant-client>=1.11",
]
ingest = [
    "requests>=2.32",
    "trafilatura>=1.12",
    "langchain-text-splitters>=0.3",
]
stt = ["faster-whisper>=1.1"]
tts = ["piper-tts>=1.2", "soundfile>=0.12"]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/app", "ingest", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api", "."]
asyncio_mode = "auto"
markers = [
    "models: needs downloaded ML models (skipped in CI)",
    "slow: slow test",
]
