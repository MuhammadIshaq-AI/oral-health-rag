# OpenRouter: one key, many models, and generally steadier latency than the
# Gemini free tier. NOTE: questions and retrieved passages are sent to
# OpenRouter and the upstream provider it routes to. See PRIVACY.md.
extends: default.yaml
name: openrouter-flash
description: Gemini 2.5 Flash via OpenRouter, hybrid + rerank retrieval.
llm:
  provider: openrouter
  model: google/gemini-2.5-flash
  seed: null
  timeout_s: 90
# The same model judges groundedness (chosen for cost); the report flags the
# resulting self-preference bias.
judge_llm:
  provider: openrouter
  model: google/gemini-2.5-flash
  temperature: 0.0
  max_tokens: 2500
  seed: null
  timeout_s: 120
